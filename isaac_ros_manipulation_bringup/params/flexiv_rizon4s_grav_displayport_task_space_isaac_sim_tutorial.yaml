workflow_type: DISPLAYPORT_CABLE_INSERTION
robot_type: FLEXIV

rizon_type: Rizon4s
gripper_type: grav
use_sim_time: 'true'
setup: flexiv_test_bench

robot_launch_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_driver_utils)/launch/flexiv_rizon_sim_driver.launch.py

# Generated by displayport_task_space_isaac_sim_tutorial.launch.py before this
# workflow is included.
urdf_path: /tmp/flexiv_rizon4s_grav_nominal_sim.urdf
srdf_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/srdf/rizon_grav.srdf.xacro
joint_limits_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/joint_limits.yaml
kinematics_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/kinematics_sim.yaml
moveit_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/moveit_sim_controllers.yaml
ros2_controllers_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/ros2_control_controllers_sim.yaml

cumotion_urdf_file_path: $(ros2 pkg prefix --share isaac_ros_cumotion_robot_description)/urdf/flexiv_rizon4s_grav.urdf
cumotion_xrdf_file_path: $(ros2 pkg prefix --share isaac_ros_cumotion_robot_description)/xrdf/flexiv_rizon4s_grav_no_gripper_spheres.xrdf

# Pick and place params
pick_and_place_planner_retries: 5
pick_and_place_retry_wait_time: 5.0
grasps_file_path: $(ros2 pkg prefix --share isaac_ros_manipulation_flexiv_robot_description)/config/grav_grasps_dp_plug_isaac_sim.yaml
time_dilation_factor: '0.25'
gripper_max_effort: 2.0
gripper_open_position: 0.7854
# Match the IsaacLab-exported USD finger_joint close target and drive max force.
gripper_close_position: -0.155

object_attachment_type: CUBOID
object_attachment_scale: [0.003, 0.003, 0.003]

behavior_tree_config_file: ${ISAAC_ROS_MANIPULATION_PICK_AND_PLACE_CONFIG_DIR}/flexiv_pick_and_place_behavior_tree_params.yaml
blackboard_config_file: ${ISAAC_ROS_MANIPULATION_PICK_AND_PLACE_CONFIG_DIR}/flexiv_pick_and_place_blackboard_params.yaml

# DisplayPort cable insertion parameters. The insertion policy runs in
# displayport_task_space_isaac_sim_tutorial.launch.py as an external task-space
# policy, so the legacy ros2_control Deploy controller path is disabled here.
displayport_insertion_deploy_pre_goal_wait_sec: 0.0
displayport_insertion_enable_controller_switching: 'false'

# Orchestration controls for Isaac Sim.
displayport_insertion_pick_retract_offset_distance: [0.0, 0.0, 0.05]
displayport_insertion_use_cartesian_pickup_retract: 'false'
displayport_insertion_disable_pick_planning_scene: 'true'
displayport_insertion_disable_place_planning_scene: 'true'

# Joint-space policy start pose used by the orchestrator for the approach to insertion.
displayport_insertion_policy_home_joint_position: [0.5661848093469605, -0.2916445180082525, -0.09930923443847736, 2.2406536937103203, 0.11763519158441782, 0.9765117164908275, 1.9467402476744753]
displayport_insertion_use_joint_state_planner: 'true'

# Manual pose workflow: skip SAM/FoundationPose and use YAML plug + socket poses in the
# robot base frame as [x, y, z, qx, qy, qz, qw].
displayport_insertion_use_manual_poses: 'true'
displayport_insertion_manual_plug_pose: [0.72, -0.18071800476827427, 0.02596919968836011, 0.0, 0.0, 0.0, 1.0]
displayport_insertion_manual_socket_pose: [0.475, 0.125, 0.055, -0.5, -0.5, -0.5, 0.5]

displayport_insertion_run_rl_inference: 'true'
displayport_insertion_deploy_external_policy: 'true'
displayport_insertion_pre_deploy_close_gripper: 'true'
displayport_insertion_post_deploy_open_gripper: 'true'
displayport_insertion_post_deploy_pre_open_wait_sec: 5.0
displayport_insertion_post_deploy_open_wait_sec: 3.0
displayport_insertion_post_deploy_retract_to_hover: 'true'
displayport_insertion_post_deploy_retreat_lift_distance: 0.05
displayport_insertion_offset_for_hover_pose: 0.282382149
displayport_insertion_hover_pose_orientation: [0.70710678, 0.70710678, 0.0, 0.0]
displayport_insertion_timeout_for_insertion_action_call: 8.0
